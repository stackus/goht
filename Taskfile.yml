# https://taskfile.dev
version: '3'

silent: true

dotenv:
  - ./.version

tasks:
  prepare-release:
    desc: Create, tag, and push a release
    summary: |
      Verify the changelog, update .version, regenerate templates, commit,
      tag, and push a release. The working tree must be clean.

      Usage: task prepare-release -- vMAJOR.MINOR.PATCH
    cmds:
      - ./scripts/prepare-release.sh {{ .CLI_ARGS }}
